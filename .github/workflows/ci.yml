name: Linux CI
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME dependencies
        run: |
          apt-get update
          apt-get install -y libgtk-4-dev libadwaita-1-dev libsqlite3-dev libsecret-1-dev libssl-dev libcurl4-openssl-dev zstd xvfb dbus-x11
      - name: Build
        run: swift build -j 4
      - name: Test
        run: swift test -j 4
      - name: Tray integration smoke
        run: ./scripts/smoke-linux.sh
      - name: Release compilation
        run: swift build -c release -j 4
