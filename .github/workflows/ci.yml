name: Linux CI and packaging
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (for example, 1.0.5)
        required: true
        default: "1.0.5"
        type: string
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-and-package:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    timeout-minutes: 45
    env:
      TM_VERSION: ${{ inputs.version || '1.0.5' }}
      TM_DEB_REVISION: ${{ github.run_number }}
      SWIFT_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME dependencies
        run: |
          apt-get update
          apt-get install -y libgtk-4-dev libadwaita-1-dev libsqlite3-dev libsecret-1-dev libssl-dev libcurl4-openssl-dev zstd xvfb dbus-x11 python3 python3-gi dpkg-dev desktop-file-utils gnome-shell gnome-session-bin
      - name: Build
        run: swift build -j 4
      - name: Test
        run: |
          swift test -j 4
          /usr/bin/python3 scripts/test-panel-setup.py
      - name: Tray integration smoke
        run: ./scripts/smoke-linux.sh
      - name: GNOME Shell extension integration smoke
        run: |
          /usr/bin/python3 scripts/test-panel-login-order.py
          ./scripts/smoke-gnome-extension.sh
      - name: Compile and package release
        run: ./scripts/package-deb.sh
      - name: Package GNOME Shell extension
        run: ./scripts/package-extension.sh
      - name: Verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/toastmonitor-deb"
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --extract dist/release/*.deb "$package_root"
          test ! -e "$package_root/usr/share/gnome-shell/extensions/toastmonitor@yeyebbc.github.io"
          test -s "$package_root/usr/share/toastmonitor/gnome-extension/extension.js"
          test -s "$package_root/usr/share/toastmonitor/gnome-extension/metadata.json"
          test -s "$package_root/usr/share/toastmonitor/gnome-extension/toastmonitor-token-symbolic.svg"
          test -x "$package_root/usr/libexec/toastmonitor/enable-gnome-panel"
          desktop-file-validate "$package_root/etc/xdg/autostart/io.github.yeyebbc.ToastMonitor-panel-setup.desktop"
          desktop-file-validate "$package_root/etc/xdg/autostart/io.github.yeyebbc.ToastMonitor-panel-install.desktop"
          desktop-file-validate "$package_root/usr/share/applications/io.github.yeyebbc.ToastMonitor.desktop"
          (cd dist/release && sha256sum -c *.deb.sha256)
          export LD_LIBRARY_PATH="$package_root/usr/lib/toastmonitor"
          export TM_SMOKE_BINARY="$package_root/usr/bin/ToastMonitor"
          "$TM_SMOKE_BINARY" --version
          dbus-run-session --config-file scripts/smoke-linux-bus.conf -- xvfb-run -a bash scripts/smoke-linux-session.sh
          TM_PANEL_SETUP_HELPER="$package_root/usr/libexec/toastmonitor/enable-gnome-panel" TM_PANEL_EXTENSION_SOURCE="$package_root/usr/share/toastmonitor/gnome-extension" ./scripts/smoke-gnome-extension.sh
      - name: Upload Debian package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: toastmonitor-linux-amd64-${{ github.sha }}
          path: |
            dist/release/*.deb
            dist/release/*.deb.sha256
            dist/release/*.shell-extension.zip
            dist/release/*.shell-extension.zip.sha256
          if-no-files-found: error
          retention-days: 30
